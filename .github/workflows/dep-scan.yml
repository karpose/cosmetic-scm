name: 依赖漏洞扫描

# 每周一次，也可以手动跑。不放在 PR 检查里：外部服务不稳定或新公布漏洞时，不该拦住无关的合并。
on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

jobs:
  scan:
    name: 依赖漏洞扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 后端依赖
        working-directory: backend
        run: |
          mvn -q -B dependency:list -DincludeScope=runtime -DoutputFile=dependency-list.txt
          python3 ../scripts/dep-scan.py dependency-list.txt
      - name: 前端依赖
        if: always()
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
