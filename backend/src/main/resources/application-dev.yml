# 本地开发：H2 文件数据库（MySQL 兼容模式），无需安装 MySQL；启动时自动写入示例数据
spring:
  datasource:
    url: jdbc:h2:file:./data/scm-dev;MODE=MySQL;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

scm:
  cache:
    ttl-seconds: 0
  demo-data: true
  security:
    force-password-change: false   # 本地演示不强制改密
  integration:
    api-key: dev-integration-key   # 仅本地开发用
