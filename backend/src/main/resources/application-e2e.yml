# Playwright 冒烟测试专用：内存库，每次启动都是全新的示例数据，跑完即丢，不碰本地开发库
spring:
  datasource:
    url: jdbc:h2:mem:scm-e2e;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

server:
  port: 8090

scm:
  demo-data: true
  security:
    force-password-change: false
  integration:
    api-key: e2e-integration-key
