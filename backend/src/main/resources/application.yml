server:
  port: 8080

spring:
  web:
    # 校验提示固定用中文，不随浏览器语言变化
    locale: zh_CN
    locale-resolver: fixed
  application:
    name: cosmetic-scm
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # 表结构只由 Flyway 管理
    properties:
      hibernate.jdbc.batch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # 故意高于 nginx 的 25 MB 和业务上限 20 MB（scm.storage.max-file-mb）：
      # 在这里中途拒绝的话，后端没读完请求体就回错误，和 nginx 互相等待直到超时
      max-file-size: 30MB
      max-request-size: 30MB
  # 每日提醒的邮件服务。host 留空表示不发邮件；默认按 465 端口 SSL 连接
  mail:
    host: ${SCM_SMTP_HOST:}
    port: ${SCM_SMTP_PORT:465}
    username: ${SCM_SMTP_USERNAME:}
    password: ${SCM_SMTP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: ${SCM_SMTP_AUTH:true}
      mail.smtp.ssl.enable: ${SCM_SMTP_SSL:true}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

scm:
  timezone: Asia/Shanghai
  jwt:
    # 生产环境必须通过环境变量 SCM_JWT_SECRET 设置，至少 32 个字符
    secret: ${SCM_JWT_SECRET:dev-only-secret-please-change-0123456789abcdef}
    ttl-hours: 12
  bootstrap-admin:
    # 首次启动、库中没有任何账号时创建管理员；上线后请立即改密码
    username: ${SCM_ADMIN_USERNAME:admin}
    password: ${SCM_ADMIN_PASSWORD:Admin@123456}
  demo-data: false
  security:
    max-failed-logins: 5         # 连续输错几次锁定
    lock-minutes: 15             # 锁定多久
    password-max-age-days: 90    # 密码有效期，0 表示不限
    # 管理员新建 / 重置的账号首次登录必须改密，密码过期后必须改密
    force-password-change: ${SCM_FORCE_PASSWORD_CHANGE:true}
  integration:
    # 电商 ERP 调用 /api/integration/** 时在请求头 X-Api-Key 里带上；留空则关闭对接接口
    api-key: ${SCM_INTEGRATION_API_KEY:}
  storage:
    # 附件文件目录；Docker 部署时是一个卷（见 docker-compose.yml），备份容器会一起打包
    dir: ${SCM_STORAGE_DIR:./data/files}
    max-file-mb: 20
  compliance:
    # 打开后，安全评估和标签没签批的不能上市放行。默认关闭：一上线就拦，所有现存产品都放不了行。资料补齐后再打开
    require-docs-for-release: ${SCM_COMPLIANCE_REQUIRE_DOCS:false}
  notify:
    # 每日待办摘要。enabled=false 时不启动定时任务，管理员仍可在“消息提醒”页手工发送
    enabled: ${SCM_NOTIFY_ENABLED:false}
    cron: ${SCM_NOTIFY_CRON:0 30 8 * * *}
    mail-to: ${SCM_NOTIFY_MAIL_TO:}         # 收件人，多个用英文逗号隔开
    wecom-webhook: ${SCM_NOTIFY_WECOM_WEBHOOK:}   # 企业微信群机器人地址，含密钥，不要提交到仓库
  serial:
    # 一物一码导出给印刷厂时拼在码前面的扫码地址，生产环境改成正式域名，如 https://scm.example.com/v/
    verify-url-prefix: ${SCM_VERIFY_URL_PREFIX:http://localhost:5173/v/}

logging:
  level:
    com.cosmetic.scm: INFO
