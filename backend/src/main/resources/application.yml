server:
  port: 8080

spring:
  application:
    name: cosmetic-scm
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # 表结构只由 Flyway 管理
    properties:
      hibernate.jdbc.batch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

scm:
  timezone: Asia/Shanghai
  jwt:
    # 生产环境必须通过环境变量 SCM_JWT_SECRET 设置，至少 32 个字符
    secret: ${SCM_JWT_SECRET:dev-only-secret-please-change-0123456789abcdef}
    ttl-hours: 12
  bootstrap-admin:
    # 首次启动、库中没有任何账号时创建管理员；上线后请立即改密码
    username: ${SCM_ADMIN_USERNAME:admin}
    password: ${SCM_ADMIN_PASSWORD:Admin@123456}
  demo-data: false

logging:
  level:
    com.cosmetic.scm: INFO
