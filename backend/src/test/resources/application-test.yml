spring:
  datasource:
    url: jdbc:h2:mem:scm-test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate   # 测试时校验实体与 Flyway 表结构一致

scm:
  cache:
    ttl-seconds: 0
  demo-data: true
  security:
    force-password-change: false
  integration:
    api-key: test-integration-key
  storage:
    dir: ${java.io.tmpdir}/scm-test-files
