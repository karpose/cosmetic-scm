# 一键部署：MySQL 8 + 后端 + 前端（nginx）
# 使用前复制 .env.example 为 .env 并修改其中的密码和密钥
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cosmetic_scm
      MYSQL_USER: scm
      MYSQL_PASSWORD: ${SCM_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SCM_DB_HOST: mysql
      SCM_DB_PASSWORD: ${SCM_DB_PASSWORD}
      SCM_JWT_SECRET: ${SCM_JWT_SECRET}
      SCM_ADMIN_PASSWORD: ${SCM_ADMIN_PASSWORD}
      SCM_DEMO_DATA: ${SCM_DEMO_DATA:-false}

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${SCM_HTTP_PORT:-80}:80"

volumes:
  mysql-data:
