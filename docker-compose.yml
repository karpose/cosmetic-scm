# 一键部署：MySQL 8 + 后端 + 前端（nginx）
# 使用前复制 .env.example 为 .env 并修改其中的密码和密钥
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cosmetic_scm
      MYSQL_USER: scm
      MYSQL_PASSWORD: ${SCM_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SCM_DB_HOST: mysql
      SCM_DB_PASSWORD: ${SCM_DB_PASSWORD}
      SCM_JWT_SECRET: ${SCM_JWT_SECRET}
      SCM_ADMIN_PASSWORD: ${SCM_ADMIN_PASSWORD}
      SCM_DEMO_DATA: ${SCM_DEMO_DATA:-false}
      SCM_INTEGRATION_API_KEY: ${SCM_INTEGRATION_API_KEY:-}
      SCM_VERIFY_URL_PREFIX: ${SCM_VERIFY_URL_PREFIX:-http://localhost/v/}
      SCM_STORAGE_DIR: /app/files
      SCM_COMPLIANCE_REQUIRE_DOCS: ${SCM_COMPLIANCE_REQUIRE_DOCS:-false}
      SCM_REQUIRE_CHANGE_FOR_FORMULA: ${SCM_REQUIRE_CHANGE_FOR_FORMULA:-false}
      SCM_NOTIFY_ENABLED: ${SCM_NOTIFY_ENABLED:-false}
      SCM_NOTIFY_CRON: ${SCM_NOTIFY_CRON:-0 30 8 * * *}
      SCM_NOTIFY_MAIL_TO: ${SCM_NOTIFY_MAIL_TO:-}
      SCM_NOTIFY_WECOM_WEBHOOK: ${SCM_NOTIFY_WECOM_WEBHOOK:-}
      SCM_SMTP_HOST: ${SCM_SMTP_HOST:-}
      SCM_SMTP_PORT: ${SCM_SMTP_PORT:-465}
      SCM_SMTP_SSL: ${SCM_SMTP_SSL:-true}
      SCM_SMTP_AUTH: ${SCM_SMTP_AUTH:-true}
      SCM_SMTP_USERNAME: ${SCM_SMTP_USERNAME:-}
      SCM_SMTP_PASSWORD: ${SCM_SMTP_PASSWORD:-}
    volumes:
      - files-data:/app/files
    healthcheck:
      # 镜像里没有 curl，用 bash 的 /dev/tcp 访问健康检查接口；数据库不通时接口返回 503
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /api/health HTTP/1.0\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q 200'"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 5

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${SCM_HTTP_PORT:-80}:80"

  # 每天定时备份数据库到 ./backups（保留天数、时间见 .env）。请再把 ./backups 同步到异地或对象存储。
  backup:
    build: ./deploy/backup
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: cosmetic_scm
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      BACKUP_AT: ${SCM_BACKUP_AT:-02:30}
      BACKUP_KEEP_DAYS: ${SCM_BACKUP_KEEP_DAYS:-30}
      TZ: Asia/Shanghai
    volumes:
      - ./backups:/backups
      - files-data:/files:ro

volumes:
  mysql-data:
  files-data:
