# HTTPS：证书放在 deploy/certs/fullchain.pem 和 privkey.pem（如 Let's Encrypt / 云厂商证书）
# 启用方式：docker compose -f docker-compose.yml -f docker-compose.https.yml up -d --build
server_tokens off;

server {
    listen 80;
    server_name _;
    # Let's Encrypt 续期验证
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 25m;
    # 超限时也回前端能显示的中文提示（20–25 MB 的文件由后端按业务上限拒绝）
    error_page 413 @too_large;
    location @too_large {
        default_type application/json;
        return 413 '{"message":"文件太大，单个附件不能超过 20 MB"}';
    }

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/conf.d/security-headers.inc;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri $uri/ /index.html;
    }
}
